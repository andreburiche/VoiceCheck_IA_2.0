name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          # CVE-2026-111497: evitar Node 20 EOL; preferir 24.22.1+
          node-version: "24.22.1"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

  api-unit:
    name: API (unit offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: CSRF / JWT units
        run: pytest -q tests/test_security.py tests/test_hardening.py::test_csrf_token_is_signed
        env:
          # Settings mínimas para import
          JWT_SECRET: ci_test_jwt_secret_at_least_32_chars_long
          CSRF_SECRET: ci_test_csrf_secret_at_least_32_chars

  compose-smoke:
    name: Compose smoke (API health + pytest)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - name: Env
        run: |
          cp .env.example .env
          sed -i 's/ALLOW_CONTRACT_STEMS=0/ALLOW_CONTRACT_STEMS=1/' .env
          sed -i 's/SEPARATION_ADAPTER=.*/SEPARATION_ADAPTER=contract/' .env
      - name: Up stack (api+deps)
        run: docker compose -f infra/docker-compose.yml up -d --build mysql redis api worker
      - name: Wait health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "API up"
              exit 0
            fi
            sleep 3
          done
          docker compose -f infra/docker-compose.yml logs api --tail 80
          exit 1
      - name: Pytest
        run: docker exec estudio-api pytest -q
      - name: Metrics endpoint
        run: curl -sf http://localhost:8000/metrics | head -n 5
      - name: Teardown
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
