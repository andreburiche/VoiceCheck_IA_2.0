# VoiceCheck IA 2.0 — ambiente local ISOLADO (não usa os contêineres, portas nem o banco do projeto original).
# Site: http://localhost:3100   API: http://localhost:8110
# Subir:  docker compose -p vc2local -f infra/docker-compose.v2-local.yml up -d --build
# Parar:  docker compose -p vc2local -f infra/docker-compose.v2-local.yml down   (os dados ficam guardados)
name: vc2local

services:
  mysql:
    image: mysql:8.4
    container_name: vc2l-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: vc2_raiz_local
      MYSQL_DATABASE: vc2
      MYSQL_USER: vc2
      MYSQL_PASSWORD: vc2_local
    volumes:
      - vc2l_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pvc2_raiz_local"]
      interval: 5s
      timeout: 5s
      retries: 30
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

  redis:
    image: redis:7-alpine
    container_name: vc2l-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    image: vc2-api-teste
    container_name: vc2l-api
    restart: unless-stopped
    env_file:
      # IA de texto gratuita e local (Ollama) por padrão; o ../.env pode trocar (vem depois e prevalece)
      - ia-local.env
      - ../.env
    environment:
      APP_ENV: development
      DATABASE_URL: mysql+pymysql://vc2:vc2_local@mysql:3306/vc2
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /data/audio
      PUBLIC_API_URL: http://127.0.0.1:8110
      PUBLIC_WEB_URL: http://localhost:3100
      CORS_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
    # portas presas ao próprio computador: ninguém da rede local acessa banco, API ou IA
    ports:
      - "127.0.0.1:8110:8000"
    volumes:
      - ../apps/api:/app
      - vc2l_audio:/data/audio
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # IA de texto local e gratuita (aba Documentos). O modelo é baixado uma vez pelo baixar-ia-local.bat
  # e fica no volume vc2l_ollama; nada do texto sai do computador.
  ollama:
    # só o próprio computador alcança a porta (127.0.0.1)
    image: ollama/ollama:latest
    container_name: vc2l-ollama
    restart: unless-stopped
    volumes:
      - vc2l_ollama:/root/.ollama
    ports:
      - "127.0.0.1:11435:11434"

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    container_name: vc2l-web
    restart: unless-stopped
    environment:
      CI: "true"
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
      # o navegador fala com a API pelo /__api do próprio Next (proxy para o serviço "api")
      DEV_API_PROXY_TARGET: http://api:8000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8110
      NEXT_PUBLIC_APP_URL: http://localhost:3100
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - ../apps/web:/app
      - vc2l_node_modules:/app/node_modules
      - vc2l_next:/app/.next
    depends_on:
      - api
    command: sh -c "pnpm install --ignore-scripts && rm -rf .next/dev && pnpm exec next dev --webpack --hostname 0.0.0.0 --port 3000"

volumes:
  vc2l_ollama:
  vc2l_mysql:
  vc2l_audio:
  vc2l_node_modules:
  vc2l_next:
