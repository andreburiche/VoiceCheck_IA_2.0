openapi: 3.1.0
info:
  title: Estúdio Musical API
  version: 0.1.0
  description: Contrato canônico /api/v1 (Fase 1 — auth). Fonte gerada/sincronizada com FastAPI.
servers:
  - url: http://localhost:8000
    description: Desenvolvimento local
paths:
  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        "200":
          description: OK
  /api/v1/auth/register:
    post:
      summary: Registrar usuário
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: E-mail já cadastrado
  /api/v1/auth/login:
    post:
      summary: Login
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/logout:
    post:
      summary: Logout
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Sessão encerrada
  /api/v1/users/me:
    get:
      summary: Usuário autenticado
      operationId: usersMe
      tags: [users]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Não autenticado
components:
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 2
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    UserResponse:
      type: object
      required: [id, email, name, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required: [user, csrf_token]
      properties:
        user:
          $ref: "#/components/schemas/UserResponse"
        csrf_token:
          type: string
